<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake: Phase Merge</title>
<style>
  body {
    margin:0; background:#0a0c1a; color:#fff;
    font-family: system-ui, sans-serif; display:flex; flex-direction:column; align-items:center;
    overflow:hidden;
  }
  h1 { margin:10px 0; font-size:1.4rem; }
  canvas { background:#11172a; border:2px solid #7b61ff; border-radius:8px; }
  .hud {
    display:flex; gap:20px; margin:10px; font-weight:bold;
    flex-wrap: wrap; justify-content: center;
  }
  #gameOverScreen {
    display: none;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.85);
    padding: 20px 30px;
    border-radius: 10px;
    text-align: center;
    font-size: 1.3rem;
    z-index: 10;
  }
  #restartBtn {
    margin-top: 16px;
    padding: 8px 20px;
    background: #7b61ff;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 1rem;
  }
  #restartBtn:hover {
    background: #6a52e0;
  }
</style>
</head>
<body>
<h1>Snake: Phase Merge</h1>
<div class="hud">
  <div>Score: <span id="score">0</span></div>
  <div>Path: <span id="pathLength">0</span></div>
  <div>Swap in: <span id="swapTimer">5</span>s</div>
</div>
<canvas id="game" width="440" height="440"></canvas>

<div id="gameOverScreen">
  <div>Game Over</div>
  <div>Score: <span id="finalScore">0</span> | Path: <span id="finalPath">0</span></div>
  <button id="restartBtn">Play Again (R)</button>
</div>

<script>
const CONFIG = {
  CELL: 20,
  COLS: 22,
  ROWS: 22,
  MOVE_DELAY: 150,
  SWAP_INTERVAL: 5000,
  MERGE_DURATION: 3000,
  SCORE_FOOD: 10,
  SCORE_MERGED_FOOD: 20
};

const ctx = document.getElementById('game').getContext('2d');
const scoreEl = document.getElementById('score');
const pathEl = document.getElementById('pathLength');
const timerEl = document.getElementById('swapTimer');
const gameOverScreen = document.getElementById('gameOverScreen');
const finalScoreEl = document.getElementById('finalScore');
const finalPathEl = document.getElementById('finalPath');
const restartBtn = document.getElementById('restartBtn');

let state = 'play'; // 'play' | 'over'
let score = 0;
let pathLength = 0;
let animationId = null;

let primarySnake = [];
let secondarySnake = [];
let food = null;

let dir = {x: 1, y: 0};
let nextDir = {x: 1, y: 0};

let isMerged = false;
let mergeEndTime = 0;
let lastSwapTime = 0;
let lastMoveTime = 0;

let primaryPath = 0;
let secondaryPath = 0;

function init() {
  primarySnake = [{x: 5, y: 5}];
  secondarySnake = [{x: CONFIG.COLS - 6, y: CONFIG.ROWS - 6}];
  for (let i = 1; i < 5; i++) {
    primarySnake.push({x: 5 - i, y: 5});
    secondarySnake.push({x: CONFIG.COLS - 6 + i, y: CONFIG.ROWS - 6});
  }

  primaryPath = secondaryPath = 0;
  score = 0;
  pathLength = 0;
  isMerged = false;
  lastSwapTime = performance.now();
  placeFood();
  updateHUD();
}

function placeFood() {
  const occupied = new Set();
  const snakes = isMerged ? [primarySnake] : [primarySnake, secondarySnake];
  for (const snake of snakes) {
    for (const seg of snake) {
      occupied.add(`${seg.x},${seg.y}`);
    }
  }

  let x, y;
  do {
    x = Math.floor(Math.random() * CONFIG.COLS);
    y = Math.floor(Math.random() * CONFIG.ROWS);
  } while (occupied.has(`${x},${y}`));

  food = {x, y};
}

function drawCell(x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * CONFIG.CELL, y * CONFIG.CELL, CONFIG.CELL - 1, CONFIG.CELL - 1);
}

function moveSnake(snake, direction, isPrimary) {
  const head = {
    x: (snake[0].x + direction.x + CONFIG.COLS) % CONFIG.COLS,
    y: (snake[0].y + direction.y + CONFIG.ROWS) % CONFIG.ROWS
  };

  if (!isMerged && isPrimary) {
    for (let i = 0; i < snake.length; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) {
        return null; // collision
      }
    }
  }

  snake.unshift(head);
  return head;
}

function update(now) {
  if (now - lastMoveTime > CONFIG.MOVE_DELAY) {
    dir = {...nextDir};

    if (isMerged) {
      const head = moveSnake(primarySnake, dir, true);
      if (!head) { state = 'over'; return; }
      primaryPath += 1;
      if (food && head.x === food.x && head.y === food.y) {
        score += CONFIG.SCORE_MERGED_FOOD;
        placeFood();
      } else {
        primarySnake.pop();
      }
    } else {
      const pHead = moveSnake(primarySnake, dir, true);
      if (!pHead) { state = 'over'; return; }
      primaryPath += 1;
      if (food && pHead.x === food.x && pHead.y === food.y) {
        score += CONFIG.SCORE_FOOD;
        placeFood();
      } else {
        primarySnake.pop();
      }

      const sDir = {x: -dir.x, y: -dir.y};
      const sHead = moveSnake(secondarySnake, sDir, false);
      if (!sHead) { /* secondary can't kill you */ }
      else {
        secondaryPath += 1;
        if (food && sHead.x === food.x && sHead.y === food.y) {
          score += CONFIG.SCORE_FOOD;
          placeFood();
        } else {
          secondarySnake.pop();
        }
      }
    }
    lastMoveTime = now;
  }

  if (!isMerged && now - lastSwapTime > CONFIG.SWAP_INTERVAL) {
    startMerge();
  }

  if (isMerged && now > mergeEndTime) {
    endMerge();
  }

  pathLength = Math.floor(primaryPath + secondaryPath);
  updateHUD();
}

function startMerge() {
  isMerged = true;
  primarySnake = [...primarySnake, ...secondarySnake];
  secondarySnake = [];
  mergeEndTime = performance.now() + CONFIG.MERGE_DURATION;
}

function endMerge() {
  isMerged = false;
  primarySnake = [{x: 5, y: 5}];
  secondarySnake = [{x: CONFIG.COLS - 6, y: CONFIG.ROWS - 6}];
  const minLength = Math.min(5, Math.floor(score / 20) + 3);
  for (let i = 1; i < minLength; i++) {
    primarySnake.push({x: 5 - i, y: 5});
    secondarySnake.push({x: CONFIG.COLS - 6 + i, y: CONFIG.ROWS - 6});
  }
  lastSwapTime = performance.now();
}

function updateHUD() {
  const now = performance.now();
  const timeUntilSwap = isMerged 
    ? Math.max(0, Math.ceil((mergeEndTime - now) / 1000))
    : Math.max(0, Math.ceil((CONFIG.SWAP_INTERVAL - (now - lastSwapTime)) / 1000));

  scoreEl.textContent = score;
  pathEl.textContent = pathLength;
  timerEl.textContent = timeUntilSwap;
}

function render(now) {
  ctx.clearRect(0, 0, CONFIG.COLS * CONFIG.CELL, CONFIG.ROWS * CONFIG.CELL);

  // Grid
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  for (let x = 0; x <= CONFIG.COLS; x++) {
    ctx.beginPath();
    ctx.moveTo(x * CONFIG.CELL, 0);
    ctx.lineTo(x * CONFIG.CELL, CONFIG.ROWS * CONFIG.CELL);
    ctx.stroke();
  }
  for (let y = 0; y <= CONFIG.ROWS; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * CONFIG.CELL);
    ctx.lineTo(CONFIG.COLS * CONFIG.CELL, y * CONFIG.CELL);
    ctx.stroke();
  }

  // Merge overlay
  if (isMerged) {
    ctx.fillStyle = 'rgba(255, 215, 0, 0.08)';
    ctx.fillRect(0, 0, CONFIG.COLS * CONFIG.CELL, CONFIG.ROWS * CONFIG.CELL);
  }

  if (food) drawCell(food.x, food.y, '#52ffa8');

  if (isMerged) {
    primarySnake.forEach((seg, i) => {
      drawCell(seg.x, seg.y, i === 0 ? '#ffd700' : '#ff9f43');
    });
  } else {
    primarySnake.forEach((seg, i) => {
      drawCell(seg.x, seg.y, i === 0 ? '#e3f2ff' : '#7b61ff');
    });
    secondarySnake.forEach((seg, i) => {
      drawCell(seg.x, seg.y, i === 0 ? '#ff6188' : 'rgba(255,97,136,0.6)');
    });
  }
}

function gameLoop(now) {
  if (state === 'play') {
    update(now);
    render(now);
    if (state === 'over') {
      showGameOver();
    } else {
      animationId = requestAnimationFrame(gameLoop);
    }
  }
}

function showGameOver() {
  cancelAnimationFrame(animationId);
  finalScoreEl.textContent = score;
  finalPathEl.textContent = pathLength;
  gameOverScreen.style.display = 'block';
}

function restartGame() {
  gameOverScreen.style.display = 'none';
  state = 'play';
  init();
  if (animationId) cancelAnimationFrame(animationId);
  animationId = requestAnimationFrame(gameLoop);
}

// Input
window.addEventListener('keydown', (e) => {
  if (state === 'over') {
    if (e.key === 'r' || e.key === 'R') {
      restartGame();
    }
    return;
  }

  switch (e.key) {
    case 'ArrowUp':    if (dir.y === 0) nextDir = {x: 0, y: -1}; break;
    case 'ArrowDown':  if (dir.y === 0) nextDir = {x: 0, y: 1}; break;
    case 'ArrowLeft':  if (dir.x === 0) nextDir = {x: -1, y: 0}; break;
    case 'ArrowRight': if (dir.x === 0) nextDir = {x: 1, y: 0}; break;
  }
});

restartBtn.addEventListener('click', restartGame);

// Start
init();
animationId = requestAnimationFrame(gameLoop);
</script>
</body>
</html>
